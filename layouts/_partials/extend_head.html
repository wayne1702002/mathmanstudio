<script>

  document.addEventListener("DOMContentLoaded", function () {

    renderMathInElement(document.body, {

      delimiters: [

        { left: "$$", right: "$$", display: true },

        { left: "$", right: "$", display: false },

        { left: "\\[", right: "\\]", display: true },

        { left: "\\(", right: "\\)", display: false }

      ],

      throwOnError: false

    });

  });

</script>

<script>

document.addEventListener("DOMContentLoaded", function () {

  const dateBox = document.createElement("div");

  const now = new Date();

  const weekdays = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"];

dateBox.textContent =

  now.getFullYear() + "年" +

  (now.getMonth() + 1) + "月" +

  now.getDate() + "日 " +

  weekdays[now.getDay()];

  dateBox.style.cssText =

   "width:100%;max-width:1152px;margin:0 auto;padding:8px 24px;box-sizing:border-box;font-size:16px;";

  document.body.prepend(dateBox);

});

</script>

<script>
document.addEventListener("DOMContentLoaded", function () {
  const homeInfo = document.querySelector(".home-info");

  if (!homeInfo) return;

  const quotes = [
    {
      text: "數學是科學的皇后。",
      author: "高斯"
    },
    {
      text: "在數學中，提問的藝術比解答問題更有價值。",
      author: "康托爾"
    },
    {
      text: "如果人們不知道數學有多簡單，那只是因為他們沒有意識到人生有多複雜。",
      author: "馮・諾伊曼"
    },
    {

    text: "如果我看得比別人更遠，那是因為我站在巨人的肩膀上。",

    author: "牛頓"

  },
  {
  text: "我們必須知道，我們終將知道。",
  author: "希爾伯特"
},
{
  text: "數學是賦予不同事物相同名稱的藝術。",
  author: "龐加萊"
},
{
  text: "通往幾何學沒有皇家大道。",
  author: "歐幾里得"
},
{
  text: "正確看待數學，它不僅擁有真理，也擁有至高的美。",
  author: "羅素"
},
{
  text: "想像力比知識更重要。",
  author: "愛因斯坦"
},
{
  text: "宇宙這本書是以數學的語言寫成的。",
  author: "伽利略"
},
{
  text: "對我而言，一個方程式若不能表達上帝的思想，就毫無意義。",
  author: "拉馬努金"
},
{
  text: "科學眾多價值之中，最重要的必定是懷疑的自由。",
  author: "費曼"
}
  ];

 let index = Math.floor(Math.random() * quotes.length);

  const quoteBox = document.createElement("div");
  quoteBox.className = "math-quote";
  quoteBox.innerHTML =
   `${quotes[index].text} <br><span>— ${quotes[index].author}</span>`;

  homeInfo.appendChild(quoteBox);

  setInterval(function () {
    quoteBox.style.opacity = "0";

    setTimeout(function () {
      index = (index + 1) % quotes.length;
      quoteBox.innerHTML =
        `「${quotes[index].text}」<br><span>— ${quotes[index].author}</span>`;
      quoteBox.style.opacity = "1";
    }, 600);

  }, 8000);
});
</script>

<script>
document.addEventListener("DOMContentLoaded", function () {
  const exams = [
  {
    id: "gsat-countdown",
    name: "學測",
    date: "2027-01-22T00:00:00+08:00"
  },
  {
    id: "cap-countdown",
    name: "會考",
    date: "2027-05-15T00:00:00+08:00"
  }
];

  exams.forEach(function (exam) {
    const target = new Date(exam.date);
    const now = new Date();

    const today = new Date(
      now.getFullYear(),
      now.getMonth(),
      now.getDate()
    );

    const examDay = new Date(
      target.getFullYear(),
      target.getMonth(),
      target.getDate()
    );

    const diff = examDay - today;
    const days = Math.ceil(diff / (1000 * 60 * 60 * 24));

    const el = document.getElementById(exam.id);

    if (!el) return;

    if (days > 0) {
     el.innerHTML = `距離${exam.name}還有 <span>${days}</span> 天`;
    } else if (days === 0) {
      el.innerHTML = "今天考試";
    } else {
      el.innerHTML = "本屆考試已結束";
    }
  });
});
</script>
