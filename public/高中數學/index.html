<script>
document.addEventListener("DOMContentLoaded", function () {
  const homeInfo = document.querySelector(".home-info");

  if (!homeInfo) return;

  const quotes = [
    {
      text: "數學是科學的皇后。",
      author: "高斯"
    },
    {
      text: "在數學中，提問的藝術比解答問題更有價值。",
      author: "康托爾"
    },
    {
      text: "如果人們不知道數學有多簡單，那只是因為他們沒有意識到人生有多複雜。",
      author: "馮・諾伊曼"
    },
    {

    text: "如果我看得比別人更遠，那是因為我站在巨人的肩膀上。",

    author: "牛頓"

  },
  {
  text: "我們必須知道，我們終將知道。",
  author: "希爾伯特"
},
{
  text: "數學是賦予不同事物相同名稱的藝術。",
  author: "龐加萊"
},
{
  text: "通往幾何學沒有皇家大道。",
  author: "歐幾里得"
},
{
  text: "正確看待數學，它不僅擁有真理，也擁有至高的美。",
  author: "羅素"
},
{
  text: "想像力比知識更重要。",
  author: "愛因斯坦"
},
{
  text: "宇宙這本書是以數學的語言寫成的。",
  author: "伽利略"
},
{
  text: "對我而言，一個方程式若不能表達上帝的思想，就毫無意義。",
  author: "拉馬努金"
},
{
  text: "科學眾多價值之中，最重要的必定是懷疑的自由。",
  author: "費曼"
}
  ];

 let index = Math.floor(Math.random() * quotes.length);

  const quoteBox = document.createElement("div");
  quoteBox.className = "math-quote";
  quoteBox.innerHTML =
   `${quotes[index].text} <br><span>— ${quotes[index].author}</span>`;

  homeInfo.appendChild(quoteBox);

  setInterval(function () {
    quoteBox.style.opacity = "0";

    setTimeout(function () {
      index = (index + 1) % quotes.length;
      quoteBox.innerHTML =
        `「${quotes[index].text}」<br><span>— ${quotes[index].author}</span>`;
      quoteBox.style.opacity = "1";
    }, 600);

  }, 8000);
});
</script>

<script>
    let menu = document.getElementById('menu');
    if (menu) {
        
        const scrollPosition = localStorage.getItem("menu-scroll-position");
        if (scrollPosition) {
            menu.scrollLeft = parseInt(scrollPosition, 10);
        }
        
        menu.onscroll = function () {
            localStorage.setItem("menu-scroll-position", menu.scrollLeft);
        }
    }

    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
        anchor.addEventListener("click", function (e) {
            e.preventDefault();
            var id = this.getAttribute("href").substr(1);
            if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                document.querySelector(`[id='${decodeURIComponent(id)}']`).scrollIntoView({
                    behavior: "smooth"
                });
            } else {
                document.querySelector(`[id='${decodeURIComponent(id)}']`).scrollIntoView();
            }
            if (id === "top") {
                history.replaceState(null, null, " ");
            } else {
                history.pushState(null, null, `#${id}`);
            }
        });
    });

</script>
<script>
    var toplink = document.getElementById("top-link");
    window.onscroll = function () {
        const scrollThreshold = window.innerHeight;
        if (document.body.scrollTop > scrollThreshold || document.documentElement.scrollTop > scrollThreshold) {
            toplink.classList.remove("hidden");
        } else {
            toplink.classList.add("hidden");
        }
    };

</script>
<script>
    document.getElementById("theme-toggle").addEventListener("click", () => {
        const html = document.querySelector("html");
        if (html.dataset.theme === "dark") {
            html.dataset.theme = 'light';
            localStorage.setItem("pref-theme", 'light');
        } else {
            html.dataset.theme = 'dark';
            localStorage.setItem("pref-theme", 'dark');
        }
    })

</script>
